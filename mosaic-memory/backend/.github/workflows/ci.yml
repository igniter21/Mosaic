name: Validate Mosaic Memory API

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv sync --locked --dev
      - run: uv run ruff check src tests
      - run: uv run pytest tests -q
