services:
  api:
    build:
      context: ./backend
    environment:
      MOSAIC_DATA_DIR: /data
      MOSAIC_FRONTEND_ORIGIN: http://localhost:3000
      MOSAIC_COLLECTOR_ORIGINS: ${MOSAIC_COLLECTOR_ORIGINS:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mosaic_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mosaic_data:
